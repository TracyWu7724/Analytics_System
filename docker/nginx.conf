server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA — serve index.html for all unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
